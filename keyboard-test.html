<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akki Keyboard Test</title><style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#101a2a;color:#f5faff;font-family:Arial,sans-serif;overflow:hidden}
#target{display:block;position:absolute;left:2%;top:4%;width:96%;height:91%;padding:100px 35px 40px;resize:none;border:5px solid #348bf2;border-radius:24px;background:#e6f1ff;color:#10223b;font-family:Arial,sans-serif;font-size:37px;line-height:1.3}
#heading{position:absolute;top:8%;left:6%;color:#19456b;z-index:2;font-size:29px;font-weight:bold;pointer-events:none}
#note{position:absolute;bottom:6%;left:7%;font-size:20px;color:#295a7c;pointer-events:none}
</style></head><body>
<textarea id="target" placeholder="Click anywhere in this large box. Then send text from the Akki phone keyboard." aria-label="TV typing test"></textarea>
<div id="heading">AKKI TV KEYBOARD TEST</div>
<div id="note">Tap this big area using your phone Mouse tab, then Send Text</div>
<script>
var target=document.getElementById('target');
setTimeout(function(){target.focus()},900);
target.onclick=function(){target.focus()};
target.onfocus=function(){document.getElementById('note').innerHTML='Ready for phone typing';};
target.oninput=function(){document.getElementById('note').innerHTML='Text received';};
</script></body></html>
